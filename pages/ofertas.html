<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar anuncio - Plataforma Empleo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-light">

<div id="navbar-container"></div>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center g-4 align-items-start">

        <!-- COLUMNA IZQUIERDA: FORMULARIO -->
        <div class="col-12 col-lg-7 col-xl-6">
            <div class="card shadow-sm border-0 p-4 p-md-5 h-100" style="border-radius: 16px;">
                <form id="form-ofertas">
                    <div class="mb-5">
                        <label class="form-label">Tipo de publicación</label>
                        <div class="row g-4">
                            <div class="col-md-6">
                                <input type="radio" name="tipo_pub" id="tipo_oferta" value="oferta" class="d-none" checked>
                                <label for="tipo_oferta" class="option-box active w-100 h-100">
                                    <i class="bi bi-briefcase-fill d-block text-muted mb-3" style="font-size: 2.5rem;"></i>
                                    <h6 class="fw-bold mb-1 text-oferta-color">Oferta de empleo</h6>
                                    <p class="text-muted small mb-0">Empresa busca candidato</p>
                                </label>
                            </div>
                            <div class="col-md-6">
                                <input type="radio" name="tipo_pub" id="tipo_demanda" value="demanda" class="d-none">
                                <label for="tipo_demanda" class="option-box w-100 h-100">
                                    <i class="bi bi-person-bounding-box d-block text-muted mb-3" style="font-size: 2.5rem;"></i>
                                    <h6 class="fw-bold mb-1 text-muted">Demanda de empleo</h6>
                                    <p class="text-muted small mb-0">Candidato busca trabajo</p>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-12">
                            <label class="form-label">Título del puesto *</label>
                            <input type="text" id="titulo" class="form-control" placeholder="Ej: Desarrollador Full Stack Senior" required>
                        </div>
                        <div class="col-12">
                            <label id="label_entidad" class="form-label">Nombre de la empresa *</label>
                            <input type="text" id="entidad" class="form-control" placeholder="Ej: TechCorp Solutions" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Ubicación *</label>
                            <input type="text" id="ubicacion" class="form-control" placeholder="Ej: Madrid, España" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Tipo de contrato *</label>
                        <select id="modalidad" class="form-select" required>
                            <option value="" selected disabled>Seleccionar tipo...</option>
                            <option value="Presencial">Presencial</option>
                            <option value="Remoto">Remoto</option>
                            <option value="Híbrido">Híbrido</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Descripción *</label>
                        <textarea id="descripcion" class="form-control" rows="8" placeholder="Describe las responsabilidades, requisitos y beneficios del puesto..."></textarea>
                    </div>

                    <div class="mb-5">
                        <label class="form-label text-muted">Rango salarial (opcional)</label>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <input type="number" id="salario_min" class="form-control" placeholder="Mínimo (€)" min="0">
                            </div>
                            <div class="col-sm-6">
                                <input type="number" id="salario_max" class="form-control" placeholder="Máximo (€)" min="0">
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 justify-content-center">
                        <div class="col-sm-6 col-md-5 col-lg-4">
                            <button type="submit" class="btn btn-gradient w-100">Publicar</button>
                        </div>
                        <div class="col-sm-6 col-md-5 col-lg-4">
                            <button type="reset" id="btn-cancelar" class="btn btn-light w-100 text-muted fw-bold p-3" style="background-color: #f1f1f1 !important; border-radius: 8px;">
                                <i class="bi bi-x me-1"></i> Cancelar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- COLUMNA DERECHA: ANUNCIOS + GRÁFICO -->
        <div class="col-12 col-lg-5 col-xl-5">
            <div class="d-flex flex-column gap-4">

                <!-- Tablón de gestión -->
                <div class="card shadow-sm border-0 p-4" style="border-radius: 16px;">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                        <h5 class="fw-bold mb-0 text-dark">
                            <i class="bi bi-list-task me-2 text-primary"></i>Anuncios publicados
                        </h5>
                        <span class="badge bg-light text-primary border border-primary-subtle px-3 py-2"
                              id="total-badge" style="border-radius: 20px;">
                            0 anuncios
                        </span>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr class="small text-muted text-uppercase">
                                    <th style="font-size: 0.75rem;">Tipo</th>
                                    <th style="font-size: 0.75rem;">Título / Entidad</th>
                                    <th style="font-size: 0.75rem;" class="text-end">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-gestion"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Gráfico resumen -->
                <div class="card shadow-sm border-0 p-4" style="border-radius: 16px;">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                        <h5 class="fw-bold mb-0 text-dark">
                            <i class="bi bi-bar-chart-line me-2 text-primary"></i>Resumen de publicaciones
                        </h5>
                        <span class="badge bg-light text-dark border px-3 py-2"
                              style="border-radius: 20px;" id="resumen-badge">
                            0 ofertas · 0 demandas
                        </span>
                    </div>

                    <div style="position: relative; width: 100%; height: 320px;">
                        <canvas id="grafico-publicaciones"></canvas>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<script type="module" src="../js/data/shared/navbar.js"></script>
<script type="module" src="../js/pages/ofertas.js"></script>
</body>
</html>
